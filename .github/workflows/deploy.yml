name: Deploy (rsync para a VPS)

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Enviar o site por rsync para a VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # sem --delete: o servidor só aceita escrita (rrsync -wo -no-del), como o FTP fazia na prática
          rsync -rlptz --chmod=D755,F644 --exclude '.git*' --exclude '.github' --exclude 'README.md' --exclude '_aetsolidez' -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" ./ deploy@189.24.7.25:terrenos/
