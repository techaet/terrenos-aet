name: Publicar aetsolidez.com.br/equipe e /petshop

# A chave de deploy deste repositório também grava na pasta do aetsolidez.com.br na VPS (rrsync, só escrita).
# Publica só as pastas equipe/ e petshop/ (demonstração do painel de petshops) (cópia de techaet/site-aetsolidez, que é a fonte), sem apagar nada no servidor.
on:
  push:
    branches: [ main ]
    paths: [ "_aetsolidez/**" ]
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar equipe/ e petshop/ por rsync para a VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # sem --delete: o servidor só aceita escrita (rrsync -wo -no-del), como o FTP fazia na prática
          for d in equipe petshop; do rsync -rlptz --chmod=D755,F644 -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" _aetsolidez/$d/ deploy@189.24.7.25:$d/; done
