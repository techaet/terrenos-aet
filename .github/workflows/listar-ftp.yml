name: Listar pastas do FTP (diagnóstico)

# Só leitura: mostra onde o FTP começa e as pastas que existem, para achar a pasta do domínio principal
# (aetsolidez.com.br) sem expor senha. Rodar à mão (workflow_dispatch).
on: workflow_dispatch

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y -qq lftp >/dev/null
      - name: Listar
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$U,$P" -e "set ftp:ssl-force true; set ssl:verify-certificate no; set net:max-retries 1; cls -1a public_html/; bye" "$S"
